name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Fail if a real credential looks committed
        run: |
          if git grep -nIE '[0-9]{8,10}:[A-Za-z0-9_-]{35}' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::A Telegram bot token appears to be committed."
            exit 1
          fi
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be committed."
            exit 1
          fi
